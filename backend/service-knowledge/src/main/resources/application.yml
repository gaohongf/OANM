server:
  port: 8098
spring:
  config:
    import:
      # 必须项：导入 Nacos 配置（optional: 前缀表示配置非必需，缺失时不报错）
      - optional:nacos:datasource-config-${spring.profiles.active}?group=DEFAULT_GROUP
      - optional:nacos:common-config-${spring.profiles.active}?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}-${spring.profiles.active}?group=DEFAULT_GROUP

  application:
    name: service-knowledge
  profiles:
    active: dev
  main:
    # spring-ai-starter-model-ollama 会传递引入 spring-webflux（OllamaApi 同时提供
    # RestClient 和 WebClient 两套实现）。应用同时存在 spring-boot-starter-web 时
    # Spring Boot 本来就会判定为 SERVLET，这里显式写死，避免以后加依赖改变判定，
    # 让 common 里的 Reactive 自动配置被误触发。
    web-application-type: servlet
  ai:
    ollama:
      # 用 127.0.0.1 而不是 localhost: Windows 下 localhost 可能先解析到 ::1，
      # 而本机 Ollama 默认只监听 IPv4。
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      embedding:
        # 不覆盖的话默认是 mxbai-embed-large，本机没有
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
        options:
          # 必须与 knowledge_chunks.embedding 的 vector(2000) 一致，否则插入报维度不符。
          # 2000 同时也是 pgvector 对 vector 类型建 HNSW 索引的上限。
          dimensions: 2000
          # 让模型在空闲期留在显存里，避免每次索引都重新加载
          keep-alive: 10m
      init:
        # 启动时不尝试拉模型：Ollama 没起来也应该能启动服务
        pull-model-strategy: never
        embedding:
          # 启动时不做嵌入探测，同上
          include: false
  http:
    client:
      # 单批嵌入的读超时。Ollama 挂住时不能无限等，否则索引线程会被永久占满。
      connect-timeout: 2s
      read-timeout: 60s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 800

oanm:
  knowledge:
    # 与 spring.ai.ollama.embedding.options.dimensions 保持一致；代码里会校验实际向量长度
    expected-dimensions: 2000
    # EmbeddingModel.embed(List) 是一次请求，不会自动分批，这里按批调用
    embedding-batch-size: 16
    # HNSW 先取近邻再过滤，按 topK 的倍数过采样，减少过滤造成的召回损失
    search-overfetch: 3
    # 页面搜索最多返回的篇数
    search-limit: 20
    # 内部检索接口的默认 topK
    retrieve-top-k: 5
    # 余弦相似度低于该值的片段不参与页面搜索
    min-score: 0.2
