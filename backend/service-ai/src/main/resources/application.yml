server:
  port: 8085
  # port: 8082
spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  config:
    import:
      # 必须项：导入 Nacos 配置（optional: 前缀表示配置非必需，缺失时不报错）
      # datasource-config / common-config 目前本服务还用不上, 但 common 把 mybatis-plus 和
      # mysql 驱动带给了所有服务, DataSourceAutoConfiguration 因此会激活 ——
      # 不导入这两份就会启动失败: "'url' attribute is not specified and no embedded datasource"。
      # 等本服务有了自己的表, 这两份正好是要用的。
      - optional:nacos:datasource-config-${spring.profiles.active}?group=DEFAULT_GROUP
      - optional:nacos:common-config-${spring.profiles.active}?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}-${spring.profiles.active}?group=DEFAULT_GROUP

  application:
    name: service-ai
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
    # @User 的解析发生在 JSON 序列化过程中 —— 那时响应体已经开始写出, 没法再抛异常兜底。
    # 所以回源调用必须快速失败, 不能让它把整个响应拖住。
    # 默认的 60s readTimeout 会让 service-auth 抖一下就把所有响应卡死。
    # openfeign:
    #   client:
    #     config:
    #       default:
    #         connectTimeout: 500
    #         readTimeout: 800

# dromara:
#   x-file-storage:
#     local-plus:
#       - platform: local-plus-1 # 存储平台标识
#         enable-storage: true  #启用存储
#         enable-access: true #启用访问（线上请使用 Nginx 配置，效率更高）
#         domain: http://127.0.0.1:8085/file/ # 访问域名，例如：“http://127.0.0.1:8030/file/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
#         base-path: local-plus/ # 基础路径
#         path-patterns: /file/** # 访问路径
#         storage-path: E:/xfile/oanm/ # 存储路径
logging:
  level:
    # 控制整个 graph 包的日志级别
    com.alibaba.cloud.ai.graph: WARN

oanm:
  ai:
    # 自助解决节点检索知识库的参数。
    # min-score 是本地兜底阈值：知识服务的内部接口只按向量相似度排序, 不按分数过滤,
    # 0.25 以下的片段通常已经不是同一个问题了, 直接当作"没有可用知识"跳过自助节点。
    knowledge:
      enabled: true
      top-k: 5
      min-score: 0.25
      # 主动问"是哪种故障"的门槛。比 min-score 高: 猜错比不问更烦人。
      # 短句召回不到时先降这个值(0.30 左右)，仍不行再考虑检索词扩展。
      probe-min-score: 0.35
      # 检索是阻塞等待。知识服务本身很快(嵌入模型热着时几十毫秒)，但 Ollama 的嵌入模型
      # 空闲 10 分钟会被卸载、或刚和对话模型换进显存时，首次嵌入要几秒到十几秒。
      # 原来的 8s 会把这种冷启动误判成"知识库不可用"，白白跳过自助解决和故障确认。
      # 真正的故障(服务没起、嵌入报错)都是立刻返回的，等不到这个上限。
      timeout-seconds: 20