server:
  port: 8090
  # port: 8082
spring:
  config:
    import:
      # 必须项：导入 Nacos 配置（optional: 前缀表示配置非必需，缺失时不报错）
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=DEFAULT_GROUP

  application:
    name: service-work-order
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}